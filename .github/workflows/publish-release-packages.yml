name: Publish release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

# publishing-v5 needs contents:write (attach release assets) and
# id-token:write (PyPI Trusted Publishing); a called workflow may not
# exceed the caller's grant, so the ceiling is set here.
permissions:
  contents: write
  id-token: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . numpy
      - run: python tests/parity/verify_acceptance.py
      - run: python tests/parity/verify_effects.py
      - run: python tests/parity/verify_streaming.py
      - run: python tests/parity/verify_biquad.py

  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm inherited TestPyPI credentials
        env:
          TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [[ -z "$TESTPYPI_API_TOKEN" ]]; then
            echo "TESTPYPI_API_TOKEN is unavailable; ensure the organization secret is visible to PyDevices/audioif." >&2
            exit 1
          fi

  publish:
    needs:
      - parity
      - credentials
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v7
    with:
      build-kind: native-and-wasm
      distribution-name: pydevices-audioif
      # The pure-Python tier only. The native modules are firmware: MicroPython
      # and CircuitPython build them from src/ as a usermod, so there is nothing
      # for MIP to carry. audiorender is excluded as well -- it needs numpy and
      # renders a whole composition in memory, which is a desktop's job.
      mip-profile: audioinstruments,audioeffects
      # 21 as of publishing-v7: the org desktop matrix gained
      # macos-latest, and this repo's cibuildwheel config produces
      # cp310–cp314 macosx_arm64 (proven by the non-publishing
      # macos-wheels CI job). 16 linux/windows + 5 macOS.
      expected-wheel-count: 21
      wheel-filename-prefix: pydevices_audioif
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit

  publish-audioinstruments:
    needs:
      - parity
      - credentials
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v7
    with:
      build-kind: pure-python
      distribution-name: pydevices-audioinstruments
      import-name: audioinstruments
      install-dependencies: true
      working-directory: lib/audioinstruments
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit

  publish-audioeffects:
    needs:
      - parity
      - credentials
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v7
    with:
      build-kind: pure-python
      distribution-name: pydevices-audioeffects
      import-name: audioeffects
      install-dependencies: true
      working-directory: lib/audioeffects
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit

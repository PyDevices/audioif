name: Test CPython

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build numpy twine
      - run: python -m build
      - run: python -m twine check dist/*
      - shell: bash
        run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -p "test_cpython_*.py"
      - run: python tests/parity/verify_acceptance.py
      - run: python tests/parity/verify_effects.py
      - run: python tests/parity/verify_streaming.py

name: Test CPython

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (Apple Silicon) delivers the org macOS posture:
        # everything CI can prove — build, import, unit tests, parity —
        # runs on the macOS runner too.
        #
        # ubuntu-24.04-arm is the same posture for aarch64, and it is the
        # SBC story: Raspberry Pi OS 64-bit is aarch64. A native ARM runner
        # rather than QEMU, so the parity suite actually executes on the
        # architecture the wheels target — the class of bug worth catching
        # here is arithmetic that differs by architecture, which emulation
        # would reproduce faithfully only by accident.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build numpy twine
      - run: python -m build
      - run: python -m twine check dist/*
      - shell: bash
        run: python -m pip install dist/*.whl
      # test_*.py, not test_cpython_*.py: the narrower pattern once silently
      # excluded every test without the prefix. Nothing here needs more than
      # the wheel and numpy: the instrument and effect libraries, and the
      # component-contract tests and validators that went with them, live in
      # PyDevices/audiocomponents now.
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python tests/parity/verify_acceptance.py
      # The CPython half of the deinit surface (the native half runs in
      # clean-build.yml, on a real MicroPython build). The planted fault runs
      # first and must fail.
      - name: The deinit surface, and proof the probe can fail
        run: |
          if python tests/parity/deinit_surface_probe.py --fault; then
            echo "the planted fault passed, so this probe proves nothing" >&2
            exit 1
          fi
          python tests/parity/deinit_surface_probe.py
      - run: python tests/parity/verify_effects.py
      - run: python tests/parity/verify_streaming.py
      - run: python tests/parity/verify_biquad.py
      - run: python tests/parity/verify_mixdown_knee.py
      # verify_dsp ran in NO workflow until 2026-09-09, so the whole Phase 1
      # palette and the five CircuitPython 10.3.0 twins reached a green v0.3.0
      # release with their goldens ungated (audioif#71).
      #
      # x86_64 Linux only, deliberately. golden/dsp_nodes.json has no
      # per-architecture entries the way effects_component.json does, and every
      # digest in it is an x86_64 fact; aarch64 is known to differ by up to
      # 1 LSB on interpolating nodes. Widening this to ubuntu-24.04-arm needs
      # accepted per-arch digests first, exactly as verify_effects has.
      - if: matrix.os == 'ubuntu-latest'
        run: python tests/parity/verify_dsp.py --interpreters cpython

  # Non-publishing proof of the macOS wheel claim: run the same cibuildwheel
  # the release path uses (pypa/cibuildwheel, [tool.cibuildwheel] in
  # pyproject.toml) on macos-latest, compiling the native extension for
  # cp310–cp314 arm64 and running the configured import/smoke test-command
  # in each wheel. Nothing is uploaded anywhere. Release wheels still come
  # from the org reusable workflow; this job proves they would build.
  macos-wheels:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build macOS wheels (no publish)
        uses: pypa/cibuildwheel@v4.2.0
      - run: ls -l wheelhouse/

  # The same non-publishing proof for Linux aarch64, on a native ARM
  # runner. This job is currently the ONLY thing that builds an ARM wheel:
  # the org release matrix (reusable-build-native-and-wasm-wheels.yml, at
  # publishing-v8) runs ubuntu-latest, windows-latest and macos-latest, so
  # releases still ship no aarch64 wheel. See docs/building-wheels.md for
  # what closing that gap costs. Proving the build here first means the org
  # change, when it comes, is a matrix line rather than a discovery.
  linux-arm-wheels:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # No CIBW_ARCHS override: pyproject's auto64 already resolves to
      # aarch64 on this runner, which is the property that makes the org
      # matrix change a one-line addition.
      - name: Build Linux aarch64 wheels (no publish)
        uses: pypa/cibuildwheel@v4.2.0
      - run: ls -l wheelhouse/

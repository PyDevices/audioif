[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-audioif"
dynamic = ["version"]
description = "CircuitPython-compatible audio synthesis and effects for PyDevices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "PyDevices contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
]
dependencies = []

[project.urls]
Repository = "https://github.com/PyDevices/audioif"
Issues = "https://github.com/PyDevices/audioif/issues"

[tool.setuptools]
py-modules = ["audiocore", "synthio", "audiomixer", "audiofilters", "audiodelays", "audiofreeverb", "audiospeed", "audiodynamics", "audioroute", "audiomath", "audioecho", "audioconvolve"]
# Keep py-modules explicit: src/cpython is the root package directory now, and
# an automatic scan there would also pick up anything else that lands in it.
packages = ["audiorender"]
# audioinstruments and audioeffects are standalone distributions now
# (pydevices-audioinstruments, pydevices-audioeffects; see lib/*/pyproject.toml)
# and must not also ship in this wheel: two distributions owning the same
# files collide in site-packages, since the standalone packages depend on
# pydevices-audioif and would always be co-installed with it.

# The CPython target is one directory: src/cpython holds the extension source,
# the extension built in place, and the twelve modules that wrap it. They are
# top-level modules once installed -- `import audiocore` -- so the "" entry
# below is what remaps the root package, and it is also what puts a
# `build_ext --inplace` .so beside the wrappers instead of at the repo root.
#
# The pure Python library tiers live under lib/ so the MIP publisher, which
# expects <repo>/lib/<package>, can ship them to boards as well as to PyPI.
[tool.setuptools.package-dir]
"" = "src/cpython"
audiorender = "lib/audiorender"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*musllinux* *-win32"
test-command = "python -c \"from array import array; import audiocore, synthio; s=synthio.Synthesizer(sample_rate=8000); s.press(69); r,b=audiocore.get_buffer(s); assert r == 1 and b.format == 'B' and len(b) == 512\""

# auto64 -- the runner's own 64-bit architecture -- NOT ["x86_64",
# "aarch64"]. Naming both would make the x86_64 release runner try to
# build aarch64 under QEMU, which no workflow here configures; the release
# path would slow to emulation speed or fail outright. auto64 resolves to
# x86_64 on an x86_64 runner and aarch64 on an ARM one (verified against
# cibuildwheel's own Architecture.parse_config, 2026-09-02), so one config
# is correct on both and adding an ARM runner to a matrix is all it takes
# to get ARM wheels.
#
# aarch64 is the Raspberry Pi and every 64-bit SBC -- the audience the
# org's platform-support tiers already claim desktop-Linux coverage for.
# musllinux stays skipped above: the test that admits aarch64 is what
# excludes it, since we can name aarch64's users and cannot name Alpine's.
[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# arm64 only, matching the runner: an x86_64 wheel cross-compiled on an
# Apple Silicon runner could not run its test-command there, and an
# untested wheel is a claim, not a capability (platform-support-tiers.md).
# A field report from an Intel Mac is what would add x86_64.
[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.android]
archs = ["arm64_v8a", "x86_64"]
environment = { ANDROID_API_LEVEL = "21" }
test-skip = "*"

[[tool.cibuildwheel.overrides]]
select = "*-android_*"
build-frontend = "build"
